<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Concept 6: Isometric Wealth Cube & Open Bucket Chamber (Perfect Isometric Square Inset) -->
  <rect width="100" height="100" rx="24" fill="#F8FAF7"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" stroke="#E0E6DE" stroke-width="1.5"/>
  <defs>
    <linearGradient id="isoTopNew" x1="24" y1="18" x2="76" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4EBA8D"/>
      <stop offset="100%" stop-color="#2D8565"/>
    </linearGradient>
    <linearGradient id="isoLeftNew" x1="24" y1="33" x2="50" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#226950"/>
      <stop offset="100%" stop-color="#172F28"/>
    </linearGradient>
  </defs>

  <!-- Outer Isometric Top Face (Rhombus representing a horizontal square in 30° isometric projection) -->
  <!-- Center: (50, 33), dx = 26, dy = 15 -->
  <!-- Vertices: Top (50, 18), Right (76, 33), Bottom (50, 48), Left (24, 33) -->
  <path d="M50 18L76 33L50 48L24 33L50 18Z" fill="url(#isoTopNew)"/>

  <!-- Inner Isometric Chamber Opening: Perfectly concentric, mathematically true isometric square (rhombus scaled down by factor of 0.6) -->
  <!-- dx = 15.6, dy = 9 -->
  <!-- Vertices: Top (50, 24), Right (65.6, 33), Bottom (50, 42), Left (34.4, 33) -->
  <path d="M50 24L65.6 33L50 42L34.4 33L50 24Z" fill="#11241E"/>

  <!-- Inset currency coin positioned cleanly in perspective within the center of the square chamber -->
  <ellipse cx="50" cy="33" rx="5.5" ry="3.17" fill="#8DE1BD"/>

  <!-- Left vertical facet of the cube -->
  <path d="M24 33L50 48V83L24 68V33Z" fill="url(#isoLeftNew)"/>

  <!-- Right vertical facet of the cube -->
  <path d="M76 33L50 48V83L76 68V33Z" fill="#172F28"/>
</svg>